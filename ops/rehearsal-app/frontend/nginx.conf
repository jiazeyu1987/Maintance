server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 location /api/ { proxy_pass http://backend:48081; proxy_set_header Host $http_host; proxy_read_timeout 30s; }
 location = /release-info.json { add_header Cache-Control "no-store"; }
 location / { try_files $uri $uri/ /index.html; }
}
