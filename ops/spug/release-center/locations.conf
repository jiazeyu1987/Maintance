location ^~ /release-center/api/ {
    rewrite ^/release-center/api(.*) $1 break;
    proxy_pass http://127.0.0.1:18111;
    proxy_set_header X-Token $http_x_token;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 30s;
    access_log off;
}
location ^~ /release-center/ {
    alias /opt/intruoyi-spug/release-center/ui/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'" always;
}
