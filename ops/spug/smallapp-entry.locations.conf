# Additional entry only; existing /api, release pages and shared code unchanged.
location ^~ /backup-restore/ {
    alias /opt/intruoyi-spug/smallapp-ui/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'" always;
}
location ^~ /backup-entry-api/ {
    rewrite ^/backup-entry-api(.*) $1 break;
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header X-Token $http_x_token;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 30s;
    access_log off;
}
